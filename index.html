    <style>
        :root {
            --primary: #0f172a;
            --accent: #fbbf24; /* Gold */
            --rose: #e11d48;
            --glass: rgba(255, 255, 255, 0.05);
            --slide-duration: 17143ms; /* Total 60 Menit / 210 Siswa */
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: #020617;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Montserrat', sans-serif;
        }

        /* 1. STAGE & BACKGROUND */
        .stage {
            width: 1280px;
            height: 720px;
            position: relative;
            background: #0f172a;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid rgba(255,255,255,0.1);
        }

        /* Mesh Gradient Background */
        .mesh-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: 
                radial-gradient(at 0% 0%, rgba(30, 58, 138, 0.5) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(159, 18, 57, 0.3) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(251, 191, 36, 0.1) 0px, transparent 50%),
                radial-gradient(at 0% 100%, rgba(88, 28, 135, 0.4) 0px, transparent 50%);
            z-index: 0;
        }

        .floating-shape {
            position: absolute;
            background: linear-gradient(45deg, var(--rose), var(--accent));
            filter: blur(80px);
            border-radius: 50%;
            opacity: 0.2;
            z-index: 0;
            animation: move 20s infinite alternate;
        }

        @keyframes move {
            from { transform: translate(0, 0); }
            to { transform: translate(100px, 50px); }
        }

        /* 2. SLIDE ANIMATION (TRANSLATION) */
        .slide {
            position: absolute;
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            padding: 50px 80px;
            gap: 40px;
            align-items: center;
            z-index: 2;
            opacity: 0;
            transform: translateY(30px);
            transition: all 1.2s cubic-bezier(0.22, 1, 0.36, 1);
            visibility: hidden;
        }

        .slide.active {
            opacity: 1;
            transform: translateY(0);
            visibility: visible;
        }

        /* 3. CONTENT STYLING */
        .text-content {
            display: flex;
            flex-direction: column;
            z-index: 5;
        }

        .badge {
            background: var(--rose);
            color: white;
            padding: 6px 20px;
            border-radius: 4px;
            font-weight: 700;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 3px;
            width: fit-content;
            margin-bottom: 20px;
        }

        .student-name {
            font-family: 'Poppins', sans-serif;
            font-size: 42px;
            color: #fff;
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 30px;
        }

        /* Info Grid - Clean & Elegant */
        .info-card {
            background: var(--glass);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
        }

        .info-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .info-item:last-child { border: none; }

        .label { color: #94a3b8; font-weight: 400; font-size: 16px; text-transform: uppercase; letter-spacing: 1px; }
        .value { color: var(--accent); font-weight: 600; font-size: 18px; text-align: right; }

        .motivation {
            font-style: italic;
            color: #cbd5e1;
            font-size: 17px;
            line-height: 1.6;
            border-left: 3px solid var(--accent);
            padding-left: 20px;
        }

        /* 4. PHOTO STYLING */
        .photo-frame {
            width: 480px;
            height: 520px;
            margin: 0 auto;
            position: relative;
            z-index: 5;
        }

        .photo-frame::before {
            content: "";
            position: absolute;
            top: -15px; left: -15px; right: 15px; bottom: 15px;
            border: 2px solid var(--accent);
            border-radius: 20px;
            z-index: -1;
        }

        .photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 20px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
            border: 8px solid rgba(255,255,255,0.05);
        }

        /* 5. UI ELEMENTS */
        .progress-container {
            position: absolute; bottom: 0; left: 0;
            width: 100%; height: 6px;
            background: rgba(255,255,255,0.05); z-index: 100;
        }

        .progress-bar {
            height: 100%; width: 0%;
            background: linear-gradient(90deg, var(--accent), var(--rose));
        }

        .counter {
            position: absolute; top: 30px; right: 40px;
            color: rgba(255,255,255,0.2); font-size: 14px; font-weight: 700;
        }

        .bottom-decoration {
            position: absolute; bottom: 20px; left: 80px;
            color: rgba(255,255,255,0.1); font-size: 12px; letter-spacing: 2px;
        }
    </style>
