    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Montserrat:wght@300;400;600;700&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
    
    <style>
        /* 1. SETUP & VARS */
        :root {
            --bg-dark: #090d16;
            --panel-glass: rgba(255, 255, 255, 0.04);
            --accent-gold: #fbbf24;
            --accent-rose: #e11d48;
            --text-light: #f8fafc;
            --text-muted: #cbd5e1;
            --slide-duration: 17143ms; /* Pas 60 menit untuk 209 siswa */
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Montserrat', sans-serif;
        }

        /* 2. CONTAINER SLIDE */
        .slide-container {
            width: 1280px;
            height: 720px;
            position: relative;
            background: #0f172a;
            overflow: hidden;
            border: 3px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }

        /* BACKGROUND MESH GRADIENT */
        .background-pattern {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: 
                radial-gradient(at 10% 10%, rgba(30, 64, 175, 0.6) 0px, transparent 45%),
                radial-gradient(at 90% 10%, rgba(159, 18, 57, 0.4) 0px, transparent 45%),
                radial-gradient(at 90% 90%, rgba(251, 191, 36, 0.15) 0px, transparent 45%),
                radial-gradient(at 10% 90%, rgba(88, 28, 135, 0.5) 0px, transparent 45%);
            z-index: 1;
        }

        .glow-orb {
            position: absolute;
            background: linear-gradient(45deg, var(--accent-rose), var(--accent-gold));
            filter: blur(90px);
            border-radius: 50%;
            opacity: 0.15;
            z-index: 1;
            animation: floatingEffect 25s infinite alternate ease-in-out;
        }

        @keyframes floatingEffect {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(120px, -60px) scale(1.2); }
        }

        /* 3. LAYOUT STRUCTURE */
        #slide-wrapper { width: 100%; height: 100%; position: relative; z-index: 5; }

        .slide-content {
            position: absolute;
            width: 100%; height: 100%;
            display: flex;
            flex-direction: row;
            padding: 50px 75px;
            align-items: center;
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 1000ms ease-out, transform 1000ms cubic-bezier(0.16, 1, 0.3, 1);
            visibility: hidden;
        }

        .slide-content.active { opacity: 1; transform: translateY(0); visibility: visible; }

        .left-column { width: 60%; padding-right: 40px; }
        .right-column { 
            width: 40%; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* SCHOOL BRANDING AREA */
        .school-branding {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 20px;
            width: 100%;
        }

        .school-logo {
            width: 55px;
            height: 55px;
            object-fit: contain;
        }

        .school-name {
            font-family: 'Poppins', sans-serif;
            font-size: 22px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 1px;
            text-align: left;
            line-height: 1.2;
            text-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }

        /* 4. TYPOGRAPHY */
        .ucapan-selamat {
            font-family: 'Poppins', sans-serif;
            font-size: 32px;
            font-weight: 800;
            color: var(--accent-gold);
            text-transform: uppercase;
            letter-spacing: 6px;
            margin-bottom: 10px;
            display: block;
        }

        .garis-ucapan {
            width: 80px;
            height: 5px;
            background: var(--accent-rose);
            margin-bottom: 25px;
            border-radius: 2px;
        }

        .student-name {
            font-family: 'Poppins', sans-serif;
            font-size: 52px;
            color: #ffffff;
            font-weight: 700;
            line-height: 1.1;
            margin-bottom: 10px;
            text-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .student-class {
            font-family: 'Poppins', sans-serif;
            font-size: 36px;
            color: var(--accent-gold);
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 30px;
            display: block;
        }

        .identity-card {
            background: var(--panel-glass);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 25px 30px;
            margin-bottom: 30px;
        }

        .info-row {
            display: flex;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.07);
        }

        .info-row:last-child { border-bottom: none; }

        .info-label {
            width: 170px;
            color: var(--text-muted);
            font-size: 18px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .info-value {
            color: var(--text-light);
            font-size: 22px;
            font-weight: 600;
        }

        .slogan-box {
            border-left: 5px solid var(--accent-gold);
            padding-left: 25px;
            margin-top: 15px;
        }

        .slogan-text {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            color: #cbd5e1;
            font-size: 24px;
            line-height: 1.4;
        }

        /* 5. PHOTO FRAME (UKURAN DIPERKECIL SEDIKIT) */
        .photo-wrapper {
            display: inline-block;
            width: 350px; /* Diperkecil dari 400px */
            height: 455px; /* Diperkecil dari 520px agar rasio 3:4 tetap pas */
            position: relative;
        }

        .photo-wrapper::before {
            content: "";
            position: absolute;
            top: -12px; left: -12px; right: 12px; bottom: 12px;
            border: 3px solid var(--accent-gold);
            border-radius: 18px;
            z-index: 1;
        }

        .photo-wrapper img {
            width: 100%; height: 100%;
            object-fit: cover;
            border-radius: 16px;
            border: 6px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8);
            position: relative;
            z-index: 2;
        }

        /* 6. UI ELEMENTS */
        .progress-line-container {
            position: absolute; bottom: 0; left: 0;
            width: 100%; height: 8px;
            background: rgba(255, 255, 255, 0.05); z-index: 10;
        }

        .progress-line-bar {
            height: 100%; width: 0%;
            background: linear-gradient(90deg, var(--accent-gold), var(--accent-rose));
        }

        .slide-counter {
            position: absolute; top: 35px; right: 45px;
            color: rgba(255, 255, 255, 0.2); font-size: 16px; font-weight: 700;
        }
    </style>
</head>

        "Gantungkan cita-citamu setinggi langit! Jika jatuh, kau jatuh di antara bintang.",
        "Jangan biarkan masa lalu menghalangi kemegahan masa depan yang menantimu.",
        "Jadilah versi terbaik dari dirimu dalam setiap babak petualangan barumu."
    ];

    const slideWrapper = document.getElementById('slide-wrapper');
    const loadBar = document.getElementById('load-bar');
    const counterText = document.getElementById('num-counter');
    let currentIdx = 0;
    const intervalTime = 17143; // 17.143 detik

    function renderSlide() {
        const s = students[currentIdx];
        const slogan = slogans[currentIdx % slogans.length];
        
        slideWrapper.innerHTML = `
            <div class="slide-content" id="active-slide">
                <div class="left-column">
                    <span class="ucapan-selamat">Selamat Atas Kelulusan</span>
                    <div class="garis-ucapan"></div>
                    
                    <h1 class="student-name">${s.n}</h1>
                    <span class="student-class">KELAS ${s.k}</span>
                    
                    <div class="identity-card">
                        <div class="info-row">
                            <span class="info-label">NIS</span>
                            <span class="info-value">${s.nis}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">NISN</span>
                            <span class="info-value">${s.nisn}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Gender</span>
                            <span class="info-value">${s.g}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">TTL</span>
                            <span class="info-value">${s.ttl}</span>
                        </div>
                    </div>
                    
                    <div class="slogan-box">
                        <p class="slogan-text">"${slogan}"</p>
                    </div>
                </div>
                
                <div class="right-column">
<div class="school-branding" style="margin-top: -60px; margin-bottom: 40px; gap: 20px;">
    <img class="school-logo" src="logo.png" style="width: 80px; height: 80px;" 
         onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 24 24\' fill=\'%23fbbf24\'><path d=\'M12 3L1 9l11 6 9-4.91V17h2V9L12 3z\'/><path d=\'M20 12.38l-8 4.36-8-4.36V17l8 4.36 8-4.36v-4.62z\'/></svg>'" 
         alt="Logo Sekolah">
    <div class="school-name" style="font-size: 28px; white-space: nowrap; border-bottom: 2px solid var(--accent-gold); padding-bottom: 5px;">SMP Negeri 4 Amlapura</div>
</div>
                    
                    <div class="photo-wrapper">
                        <img src="images/${s.nisn}.JPG" 
                             onerror="this.src='https://via.placeholder.com/350x455/111827/fbbf24?text=${s.nisn}.JPG+KOSONG'" 
                             alt="Foto ${s.n}">
                    </div>
                </div>
            </div>
        `;

        // Update Counter
        counterText.innerText = `${currentIdx + 1} / ${students.length}`;

        // Aktifkan Efek Translasi & Fade In
        setTimeout(() => {
            const dom = document.getElementById('active-slide');
            if(dom) dom.classList.add('active');
        }, 50);

        // Reset & Jalankan Progress Bar
        loadBar.style.transition = 'none';
        loadBar.style.width = '0%';
        setTimeout(() => {
            loadBar.style.transition = `width ${intervalTime}ms linear`;
            loadBar.style.width = '100%';
        }, 50);
    }

    renderSlide();

    setInterval(() => {
        currentIdx = (currentIdx + 1) % students.length;
        renderSlide();
    }, intervalTime);
</script>
</body>
</html>
