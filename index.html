<html lang="id">
<head>
    <meta charset="UTF-8">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #090d16;
            --panel-glass: rgba(255, 255, 255, 0.03);
            --accent-gold: #fbbf24;
            --accent-rose: #e11d48;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --slide-duration: 17143ms; /* Durasi otomatis agar 210 siswa pas 60 menit */
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
        }

        body {
            background-color: var(--bg-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Montserrat', sans-serif;
        }

        /* CONTAINER UTAMA (BENTUK SLIDE LANDSCAPE) */
        .slide-container {
            width: 1280px;
            height: 720px;
            position: relative;
            background: #0f172a;
            overflow: hidden;
            border: 3px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }

        /* CORAK BACKGROUND MESH GRADIENT YANG DIPERINDAH */
        .background-pattern {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: 
                radial-gradient(at 10% 10%, rgba(30, 64, 175, 0.6) 0px, transparent 45%),
                radial-gradient(at 90% 10%, rgba(159, 18, 57, 0.4) 0px, transparent 45%),
                radial-gradient(at 90% 90%, rgba(251, 191, 36, 0.15) 0px, transparent 45%),
                radial-gradient(at 10% 90%, rgba(88, 28, 135, 0.5) 0px, transparent 45%);
            z-index: 1;
        }

        /* DEKORASI PARTIKEL MELAYANG */
        .glow-orb {
            position: absolute;
            background: linear-gradient(45deg, var(--accent-rose), var(--accent-gold));
            filter: blur(90px);
            border-radius: 50%;
            opacity: 0.15;
            z-index: 1;
            animation: floatingEffect 25s infinite alternate ease-in-out;
        }

        @keyframes floatingEffect {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(120px, -60px) scale(1.2); }
        }

        /* WRAPPER UNTUK INJEKSI DATA */
        #slide-wrapper {
            width: 100%;
            height: 100%;
            position: relative;
            z-index: 5;
        }

        /* STRUKTUR LAYOUT GRID 50:50 (KIRI IDENTITAS, KANAN FOTO) */
        .slide-content {
            position: absolute;
            width: 100%;
            height: 100%;
            display: table; /* Fallback support browser tua, dioptimasi dengan table-cell */
            padding: 55px 70px;
            
            /* Efek Animasi Translasi / Peralihan */
            opacity: 0;
            transform: translateY(25px) scale(0.99);
            transition: opacity 1000ms ease-out, transform 1000ms cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Trigger Aktif Slide */
        .slide-content.active {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .left-column {
            display: table-cell;
            width: 55%;
            vertical-align: middle;
            padding-right: 50px;
        }

        .right-column {
            display: table-cell;
            width: 45%;
            vertical-align: middle;
            text-align: center;
        }

        /* SEBELAH KIRI: KOMPONEN TEKS & IDENTITAS */
        .celebration-tag {
            display: inline-block;
            background: linear-gradient(90deg, var(--accent-rose), #be123c);
            color: var(--text-light);
            padding: 6px 18px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 15px;
            box-shadow: 0 4px 12px rgba(225, 29, 72, 0.3);
        }

        .student-name {
            font-family: 'Poppins', sans-serif;
            font-size: 38px;
            color: var(--text-light);
            font-weight: 700;
            line-height: 1.25;
            margin-bottom: 30px;
            text-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        /* Desain Tabel Identitas Semi Transparan */
        .identity-card {
            background: var(--panel-glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 14px;
            padding: 20px 25px;
            margin-bottom: 25px;
        }

        .info-row {
            display: block;
            padding: 11px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .info-row:last-child {
            border-bottom: none;
        }

        /* Label Identitas Sebelah Kiri */
        .info-label {
            display: inline-block;
            width: 140px;
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        /* Nilai/Data Sebelah Kanan */
        .info-value {
            display: inline-block;
            color: var(--accent-gold);
            font-size: 17px;
            font-weight: 600;
        }

        /* Box Kalimat Mutiara / Motivasi */
        .quote-box {
            border-left: 4px solid var(--accent-gold);
            padding-left: 20px;
            margin-top: 10px;
        }

        .quote-text {
            font-style: italic;
            color: #cbd5e1;
            font-size: 15px;
            line-height: 1.6;
        }

        /* SEBELAH KANAN: BINGKAI FOTO SIMETRIS */
        .photo-wrapper {
            display: inline-block;
            width: 410px;
            height: 510px;
            position: relative;
        }

        /* Efek Ornamen Bingkai Emas di Belakang Foto */
        .photo-wrapper::before {
            content: "";
            position: absolute;
            top: -12px; left: -12px; right: 12px; bottom: 12px;
            border: 2px solid var(--accent-gold);
            border-radius: 20px;
            z-index: 1;
            opacity: 0.7;
        }

        .photo-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 20px;
            border: 6px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
            position: relative;
            z-index: 2;
        }

        /* INDIKATOR METRIK UI */
        .progress-line-container {
            position: absolute;
            bottom: 0; left: 0;
            width: 100%; height: 6px;
            background: rgba(255, 255, 255, 0.05);
            z-index: 10;
        }

        .progress-line-bar {
            height: 100%; width: 0%;
            background: linear-gradient(90deg, var(--accent-gold), var(--accent-rose));
        }

        .slide-counter {
            position: absolute;
            top: 30px; right: 40px;
            color: rgba(255, 255, 255, 0.25);
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .footer-note {
            position: absolute;
            bottom: 20px; left: 70px;
            color: rgba(255, 255, 255, 0.15);
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
    </style>
